name: Production DB Counts

on:
  workflow_dispatch:

jobs:
  inspect:
    name: Inspect Zhilin challenge assignments
    runs-on: macos-15
    steps:
      - name: Configure pinned production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PANPAN_PROD_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.PANPAN_PROD_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 134.175.69.59 2>/dev/null > "$RUNNER_TEMP/host-keys"
          ssh-keygen -lf "$RUNNER_TEMP/host-keys" -E sha256 | awk '{print $2}' | sort -u > "$RUNNER_TEMP/host-fingerprints"
          grep -Fxq "$SSH_FINGERPRINT" "$RUNNER_TEMP/host-fingerprints"
          cat "$RUNNER_TEMP/host-keys" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect production DB read-only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes root@134.175.69.59 \
            'docker exec -i panpan-api node --input-type=module' <<'NODE'
            import fs from 'fs';
            import initSqlJs from 'sql.js';

            const SQL = await initSqlJs();
            const file = '/app/data/teach.db';
            if (!fs.existsSync(file)) throw new Error(`database missing: ${file}`);
            const db = new SQL.Database(fs.readFileSync(file));

            function all(sql, params = []) {
              const statement = db.prepare(sql);
              statement.bind(params);
              const rows = [];
              while (statement.step()) rows.push(statement.getAsObject());
              statement.free();
              return rows;
            }

            const students = all(`SELECT s.id,s.name,s.grade,c.name class_name
              FROM students s LEFT JOIN classes c ON c.id=s.class_id AND c.deleted_at IS NULL
              WHERE s.deleted_at IS NULL AND s.name LIKE ? ORDER BY s.id`, ['%芷邻%']);
            const result = students.map((student) => ({
              student,
              assignments: all(`SELECT a.id,a.question_id,a.grade_code,a.subject_code,a.question_type,
                  a.status,a.assigned_on,a.replaced_by_id,a.created_at,a.updated_at,
                  q.title,q.source_label,
                  (SELECT COUNT(*) FROM challenge_submissions_v2 sub WHERE sub.assignment_id=a.id) submission_count
                FROM challenge_assignments_v2 a
                JOIN weekly_challenge_questions q ON q.id=a.question_id
                WHERE a.student_id=?
                ORDER BY a.id DESC LIMIT 12`, [student.id]),
            }));
            console.log('PANPAN_ZHILIN_AUDIT=' + JSON.stringify(result));
            if (students.length !== 1) {
              throw new Error(`expected exactly one active student matching 芷邻; found ${students.length}`);
            }
            NODE
