name: Production DB Counts

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type inspect-practice-pending to run read-only inspection
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect all pending practice receipts
    runs-on: macos-15
    steps:
      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = 'inspect-practice-pending'

      - name: Configure pinned production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PANPAN_PROD_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.PANPAN_PROD_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 134.175.69.59 2>/dev/null > "$RUNNER_TEMP/host-keys"
          ssh-keygen -lf "$RUNNER_TEMP/host-keys" -E sha256 | awk '{print $2}' | sort -u > "$RUNNER_TEMP/host-fingerprints"
          grep -Fxq "$SSH_FINGERPRINT" "$RUNNER_TEMP/host-fingerprints"
          cat "$RUNNER_TEMP/host-keys" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read exact production state
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes root@134.175.69.59 <<'REMOTE'
          set -euo pipefail
          docker exec -i panpan-api node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import initSqlJs from 'sql.js';
          const SQL = await initSqlJs();
          const db = new SQL.Database(fs.readFileSync('/app/data/teach.db'));
          function all(sql, params = []) {
            const statement = db.prepare(sql);
            statement.bind(params);
            const rows = [];
            while (statement.step()) rows.push(statement.getAsObject());
            statement.free();
            return rows;
          }
          const namePattern = '%语晨%';
          const students = all(`SELECT s.id,s.name,s.teacher_id,s.class_id,c.name class_name,
              c.teacher_id class_teacher_id,COALESCE(s.teacher_id,c.teacher_id) effective_teacher_id,
              u.nickname effective_teacher_name,s.deleted_at,c.deleted_at class_deleted_at
            FROM students s
            LEFT JOIN classes c ON c.id=s.class_id
            LEFT JOIN users u ON u.id=COALESCE(s.teacher_id,c.teacher_id)
            WHERE s.name LIKE ? ORDER BY s.id`, [namePattern]);
          const submissions = all(`SELECT a.student_id,ps.id submission_id,ps.status,ps.current_round,ps.needs_correction,
              ps.submitted_at,ps.reviewed_at,ps.completed_at,a.id assignment_id,a.practice_date,a.plan_id,
              p.teacher_id plan_teacher_id,plan_user.nickname plan_teacher_name,
              COALESCE(s.teacher_id,c.teacher_id) effective_teacher_id,current_user.nickname effective_teacher_name,
              (SELECT COUNT(*) FROM practice_attachments pa WHERE pa.submission_id=ps.id) attachment_count,
              (SELECT COUNT(*) FROM practice_attachments pa WHERE pa.submission_id=ps.id AND pa.round_no=ps.current_round) current_round_attachment_count,
              CASE WHEN ps.status='submitted' AND COALESCE(s.teacher_id,c.teacher_id) IS NOT NULL
                AND s.deleted_at IS NULL AND c.deleted_at IS NULL THEN 1 ELSE 0 END current_queue_match
            FROM practice_submissions ps
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN practice_plans p ON p.id=a.plan_id
            JOIN students s ON s.id=a.student_id
            LEFT JOIN classes c ON c.id=s.class_id
            LEFT JOIN users plan_user ON plan_user.id=p.teacher_id
            LEFT JOIN users current_user ON current_user.id=COALESCE(s.teacher_id,c.teacher_id)
            WHERE s.name LIKE ?
            ORDER BY COALESCE(ps.submitted_at,a.practice_date) DESC,ps.id DESC LIMIT 30`, [namePattern]);
          const attachmentRounds = all(`SELECT a.student_id,pa.submission_id,pa.round_no,COUNT(*) attachment_count,
              MIN(pa.created_at) first_attachment_at,MAX(pa.created_at) last_attachment_at
            FROM practice_attachments pa
            JOIN practice_submissions ps ON ps.id=pa.submission_id
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN students s ON s.id=a.student_id
            WHERE s.name LIKE ? GROUP BY a.student_id,pa.submission_id,pa.round_no
            ORDER BY pa.submission_id DESC,pa.round_no`, [namePattern]);
          const submissionRounds = all(`SELECT a.student_id,r.submission_id,r.round_no,r.status,r.submitted_at,r.reviewed_at
            FROM practice_submission_rounds r
            JOIN practice_submissions ps ON ps.id=r.submission_id
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN students s ON s.id=a.student_id
            WHERE s.name LIKE ? ORDER BY r.submission_id DESC,r.round_no`, [namePattern]);
          const pendingCorrectionUploads = all(`SELECT s.id student_id,s.name student_name,
              a.id assignment_id,a.practice_date,ps.id submission_id,ps.status,ps.current_round,
              ps.current_round + 1 pending_round,COUNT(pa.id) pending_attachment_count,
              MIN(pa.created_at) first_attachment_at,MAX(pa.created_at) last_attachment_at,
              p.teacher_id plan_teacher_id,COALESCE(s.teacher_id,c.teacher_id) effective_teacher_id,
              u.nickname effective_teacher_name,ps.parent_id
            FROM practice_submissions ps
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN practice_plans p ON p.id=a.plan_id
            JOIN students s ON s.id=a.student_id
            LEFT JOIN classes c ON c.id=s.class_id
            LEFT JOIN users u ON u.id=COALESCE(s.teacher_id,c.teacher_id)
            JOIN practice_attachments pa ON pa.submission_id=ps.id AND pa.round_no>ps.current_round
            WHERE ps.status='correction_required' AND s.deleted_at IS NULL
              AND (c.id IS NULL OR c.deleted_at IS NULL)
            GROUP BY s.id,s.name,a.id,a.practice_date,ps.id,ps.status,ps.current_round,
              p.teacher_id,COALESCE(s.teacher_id,c.teacher_id),u.nickname,ps.parent_id
            ORDER BY MAX(pa.created_at),ps.id`);
          const pendingInitialUploads = all(`SELECT s.id student_id,s.name student_name,
              a.id assignment_id,a.practice_date,ps.id submission_id,ps.status,ps.current_round,
              COUNT(pa.id) pending_attachment_count,MIN(pa.created_at) first_attachment_at,
              MAX(pa.created_at) last_attachment_at,COALESCE(s.teacher_id,c.teacher_id) effective_teacher_id,
              u.nickname effective_teacher_name,ps.parent_id
            FROM practice_submissions ps
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN students s ON s.id=a.student_id
            LEFT JOIN classes c ON c.id=s.class_id
            LEFT JOIN users u ON u.id=COALESCE(s.teacher_id,c.teacher_id)
            JOIN practice_attachments pa ON pa.submission_id=ps.id AND pa.round_no=ps.current_round
            WHERE ps.status='uploading' AND s.deleted_at IS NULL
              AND (c.id IS NULL OR c.deleted_at IS NULL)
            GROUP BY s.id,s.name,a.id,a.practice_date,ps.id,ps.status,ps.current_round,
              COALESCE(s.teacher_id,c.teacher_id),u.nickname,ps.parent_id
            ORDER BY MAX(pa.created_at),ps.id`);
          const submittedRouting = all(`SELECT
              COUNT(*) submitted_total,
              SUM(CASE WHEN COALESCE(s.teacher_id,c.teacher_id) IS NULL THEN 1 ELSE 0 END) missing_teacher,
              SUM(CASE WHEN s.deleted_at IS NOT NULL OR (c.id IS NOT NULL AND c.deleted_at IS NOT NULL) THEN 1 ELSE 0 END) deleted_scope,
              SUM(CASE WHEN COALESCE(s.teacher_id,c.teacher_id) IS NOT p.teacher_id THEN 1 ELSE 0 END) transferred_teacher,
              SUM(CASE WHEN COALESCE(s.teacher_id,c.teacher_id) IS NOT NULL AND s.deleted_at IS NULL
                AND (c.id IS NULL OR c.deleted_at IS NULL) THEN 1 ELSE 0 END) current_queue_visible
            FROM practice_submissions ps
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN practice_plans p ON p.id=a.plan_id
            JOIN students s ON s.id=a.student_id
            LEFT JOIN classes c ON c.id=s.class_id
            WHERE ps.status='submitted'`)[0] || {};
          const integrity = db.exec('PRAGMA integrity_check')[0]?.values?.flat().map(String) || [];
          console.log('PANPAN_PRACTICE_PENDING=' + JSON.stringify({
            students, submissions, attachmentRounds, submissionRounds,
            pendingCorrectionUploads, pendingInitialUploads, submittedRouting, integrity,
          }));
          NODE
          REMOTE
