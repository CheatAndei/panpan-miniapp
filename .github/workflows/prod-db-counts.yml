name: Production DB Counts

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type repair-correction-receipt-42-118-40 to run
        required: true
        type: string

permissions:
  contents: read

jobs:
  repair:
    name: Repair confirmed correction receipt
    runs-on: macos-15
    steps:
      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = 'repair-correction-receipt-42-118-40'

      - name: Configure pinned production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PANPAN_PROD_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.PANPAN_PROD_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 134.175.69.59 2>/dev/null > "$RUNNER_TEMP/host-keys"
          ssh-keygen -lf "$RUNNER_TEMP/host-keys" -E sha256 | awk '{print $2}' | sort -u > "$RUNNER_TEMP/host-fingerprints"
          grep -Fxq "$SSH_FINGERPRINT" "$RUNNER_TEMP/host-fingerprints"
          cat "$RUNNER_TEMP/host-keys" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Backup, repair, and verify
        env:
          REPAIR_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes root@134.175.69.59 "REPAIR_ID='$REPAIR_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          case "$REPAIR_ID" in github-[0-9]*-[0-9]*) ;; *) echo 'Invalid repair id'; exit 1 ;; esac
          DEPLOY_DIR=/opt/panpan-miniapp
          DATA_DIR="$(docker inspect panpan-api --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Source}}{{end}}{{end}}')"
          PRIVATE_DIR="$(docker inspect panpan-api --format '{{range .Mounts}}{{if eq .Destination "/app/private-uploads"}}{{.Source}}{{end}}{{end}}')"
          IMAGE="$(docker inspect panpan-api --format '{{.Config.Image}}')"
          test -n "$DATA_DIR"
          test -n "$PRIVATE_DIR"
          test -n "$IMAGE"
          test -f "$DATA_DIR/teach.db"
          BACKUP_DIR="/opt/panpan-miniapp/backups/practice-correction-receipt-$REPAIR_ID"
          test ! -e "$BACKUP_DIR"
          install -d -m 700 "$BACKUP_DIR"

          rollback() {
            status="$?"
            trap - EXIT HUP INT TERM
            if [ "$status" = "0" ]; then return; fi
            set +e
            echo 'Repair failed; restoring database backup'
            (cd "$DEPLOY_DIR" && docker compose stop panpan-api)
            cp -a "$BACKUP_DIR/teach.db" "$DATA_DIR/.teach.db.rollback-$REPAIR_ID.tmp"
            mv -f "$DATA_DIR/.teach.db.rollback-$REPAIR_ID.tmp" "$DATA_DIR/teach.db"
            (cd "$DEPLOY_DIR" && docker compose up -d --no-build --pull never panpan-api)
            exit "$status"
          }
          trap rollback EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          (cd "$DEPLOY_DIR" && docker compose stop panpan-api)
          cp -a "$DATA_DIR/teach.db" "$BACKUP_DIR/teach.db"
          BACKUP_BYTES="$(stat -c%s "$BACKUP_DIR/teach.db")"
          BACKUP_SHA256="$(sha256sum "$BACKUP_DIR/teach.db" | awk '{print $1}')"
          test "$BACKUP_BYTES" -gt 0
          test "$(od -An -tx1 -N16 "$BACKUP_DIR/teach.db" | tr -d ' \n')" = '53514c69746520666f726d6174203300'
          printf '%s  teach.db\n' "$BACKUP_SHA256" > "$BACKUP_DIR/teach.db.sha256"
          chmod 600 "$BACKUP_DIR/teach.db" "$BACKUP_DIR/teach.db.sha256"

          docker run --rm -i \
            -e DATABASE_PATH=/app/data/teach.db \
            -e PRIVATE_UPLOAD_DIR=/app/private-uploads \
            -e REPAIR_ID="$REPAIR_ID" \
            -v "$DATA_DIR:/app/data" \
            -v "$PRIVATE_DIR:/app/private-uploads:ro" \
            "$IMAGE" node --input-type=commonjs <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const initSqlJs = require('sql.js');
          const dbPath = process.env.DATABASE_PATH;
          const query = (db, sql, params = []) => {
            const statement = db.prepare(sql);
            statement.bind(params);
            const rows = [];
            while (statement.step()) rows.push(statement.getAsObject());
            statement.free();
            return rows;
          };
          (async () => {
            const SQL = await initSqlJs();
            const db = new SQL.Database(fs.readFileSync(dbPath));
            const rows = query(db, `SELECT ps.*,a.student_id,a.status assignment_status,a.practice_date,
                s.name student_name,s.deleted_at,c.deleted_at class_deleted_at,
                p.teacher_id plan_teacher_id,COALESCE(s.teacher_id,c.teacher_id) effective_teacher_id
              FROM practice_submissions ps
              JOIN practice_assignments a ON a.id=ps.assignment_id
              JOIN practice_plans p ON p.id=a.plan_id
              JOIN students s ON s.id=a.student_id
              LEFT JOIN classes c ON c.id=s.class_id
              WHERE ps.id=? AND a.id=? AND s.id=?`, [40, 118, 42]);
            if (rows.length !== 1) throw new Error(`Exact submission not found: ${JSON.stringify(rows)}`);
            const before = rows[0];
            if (before.student_name !== '程语晨' || before.deleted_at || before.class_deleted_at
                || before.status !== 'correction_required' || Number(before.current_round) !== 1
                || Number(before.needs_correction) !== 1 || Number(before.parent_id) !== 36
                || Number(before.plan_teacher_id) !== 11 || Number(before.effective_teacher_id) !== 11) {
              throw new Error(`Guard mismatch: ${JSON.stringify(before)}`);
            }
            const attachments = query(db, `SELECT pa.id,pa.round_no,pa.created_at,pf.storage_key,pf.byte_size,pf.sha256
              FROM practice_attachments pa JOIN private_files pf ON pf.id=pa.file_id
              WHERE pa.submission_id=? AND pa.round_no=? ORDER BY pa.id`, [40, 2]);
            if (attachments.length !== 1) throw new Error(`Expected one pending correction photo: ${JSON.stringify(attachments)}`);
            const existingRound = query(db, 'SELECT * FROM practice_submission_rounds WHERE submission_id=? AND round_no=?', [40, 2]);
            if (existingRound.length) throw new Error(`Round 2 already exists: ${JSON.stringify(existingRound)}`);
            for (const file of attachments) {
              const root = path.resolve(process.env.PRIVATE_UPLOAD_DIR);
              const fullPath = path.resolve(root, file.storage_key);
              if (!fullPath.startsWith(`${root}${path.sep}`) || !fs.existsSync(fullPath)) {
                throw new Error(`Missing or unsafe image: ${file.storage_key}`);
              }
              const bytes = fs.readFileSync(fullPath);
              if (bytes.length !== Number(file.byte_size)
                  || crypto.createHash('sha256').update(bytes).digest('hex') !== file.sha256) {
                throw new Error(`Image integrity mismatch: ${file.storage_key}`);
              }
            }

            db.run('BEGIN TRANSACTION');
            db.run(`INSERT INTO operation_logs(actor_id,action,entity_type,entity_id,detail)
              VALUES(?,?,?,?,?)`, [11, 'practice_correction_receipt_repaired', 'practice_submission', 40,
              JSON.stringify({ repair_id: process.env.REPAIR_ID, before, pending_attachment_ids: attachments.map((x) => x.id) })]);
            db.run(`INSERT INTO practice_submission_rounds(submission_id,round_no,status,submitted_at)
              VALUES(40,2,'submitted',CURRENT_TIMESTAMP)`);
            db.run(`UPDATE practice_submissions SET current_round=2,status='submitted',needs_correction=0,
                teacher_note=NULL,submitted_at=CURRENT_TIMESTAMP,reviewed_by=NULL,reviewed_at=NULL,completed_at=NULL
              WHERE id=40 AND assignment_id=118 AND status='correction_required' AND current_round=1 AND needs_correction=1`);
            if (db.getRowsModified() !== 1) throw new Error('Submission state changed during repair');
            db.run("UPDATE practice_assignments SET status='submitted' WHERE id=118 AND student_id=42");
            if (db.getRowsModified() !== 1) throw new Error('Assignment state changed during repair');
            const after = query(db, `SELECT ps.id,ps.status,ps.current_round,ps.needs_correction,a.status assignment_status,
                COALESCE(s.teacher_id,c.teacher_id) effective_teacher_id,
                (SELECT COUNT(*) FROM practice_submission_rounds r WHERE r.submission_id=ps.id AND r.round_no=2 AND r.status='submitted') round_receipt,
                (SELECT COUNT(*) FROM practice_attachments pa WHERE pa.submission_id=ps.id AND pa.round_no=2) photo_count
              FROM practice_submissions ps
              JOIN practice_assignments a ON a.id=ps.assignment_id
              JOIN students s ON s.id=a.student_id LEFT JOIN classes c ON c.id=s.class_id
              WHERE ps.id=40`)[0];
            if (!after || after.status !== 'submitted' || Number(after.current_round) !== 2
                || Number(after.needs_correction) !== 0 || after.assignment_status !== 'submitted'
                || Number(after.effective_teacher_id) !== 11 || Number(after.round_receipt) !== 1
                || Number(after.photo_count) !== 1) throw new Error(`Verification failed: ${JSON.stringify(after)}`);
            const integrity = query(db, 'PRAGMA integrity_check');
            if (integrity.length !== 1 || integrity[0].integrity_check !== 'ok') {
              throw new Error(`SQLite integrity failed: ${JSON.stringify(integrity)}`);
            }
            db.run('COMMIT');
            const tmp = `${dbPath}.correction-receipt.tmp`;
            fs.writeFileSync(tmp, Buffer.from(db.export()));
            fs.renameSync(tmp, dbPath);
            console.log('PANPAN_CORRECTION_REPAIR=' + JSON.stringify({ ok: true, before, after, photo_count: attachments.length }));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

          test "$(od -An -tx1 -N16 "$DATA_DIR/teach.db" | tr -d ' \n')" = '53514c69746520666f726d6174203300'
          (cd "$DEPLOY_DIR" && docker compose up -d --no-build --pull never panpan-api)
          for attempt in $(seq 1 30); do
            if docker exec panpan-api wget -T 5 -qO- http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            test "$attempt" != '30'
            sleep 2
          done
          docker exec -i panpan-api node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const initSqlJs = require('sql.js');
          (async () => {
            const SQL = await initSqlJs();
            const db = new SQL.Database(fs.readFileSync('/app/data/teach.db'));
            const statement = db.prepare(`SELECT ps.id,ps.status,ps.current_round,ps.needs_correction,
                COALESCE(s.teacher_id,c.teacher_id) effective_teacher_id
              FROM practice_submissions ps JOIN practice_assignments a ON a.id=ps.assignment_id
              JOIN students s ON s.id=a.student_id LEFT JOIN classes c ON c.id=s.class_id
              WHERE ps.id=40 AND ps.status='submitted' AND ps.current_round=2
                AND ps.needs_correction=0 AND COALESCE(s.teacher_id,c.teacher_id)=11`);
            if (!statement.step()) throw new Error('Restart verification failed');
            console.log('PANPAN_CORRECTION_QUEUE=' + JSON.stringify(statement.getAsObject()));
            statement.free();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          printf 'PANPAN_CORRECTION_BACKUP={"path":"%s","bytes":%s,"sha256":"%s"}\n' "$BACKUP_DIR/teach.db" "$BACKUP_BYTES" "$BACKUP_SHA256"
          REMOTE
