name: Production DB Counts

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type inspect-all-practice-receipts to run
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect every practice receipt state
    runs-on: macos-15
    steps:
      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = 'inspect-all-practice-receipts'

      - name: Configure pinned production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PANPAN_PROD_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.PANPAN_PROD_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 134.175.69.59 2>/dev/null > "$RUNNER_TEMP/host-keys"
          ssh-keygen -lf "$RUNNER_TEMP/host-keys" -E sha256 | awk '{print $2}' | sort -u > "$RUNNER_TEMP/host-fingerprints"
          grep -Fxq "$SSH_FINGERPRINT" "$RUNNER_TEMP/host-fingerprints"
          cat "$RUNNER_TEMP/host-keys" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read all practice receipt states
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes root@134.175.69.59 <<'REMOTE'
          set -euo pipefail
          docker exec -i panpan-api node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import initSqlJs from 'sql.js';
          const SQL = await initSqlJs();
          const db = new SQL.Database(fs.readFileSync('/app/data/teach.db'));
          function all(sql, params = []) {
            const statement = db.prepare(sql);
            statement.bind(params);
            const rows = [];
            while (statement.step()) rows.push(statement.getAsObject());
            statement.free();
            return rows;
          }
          const statusSummary = all(`SELECT ps.status,COUNT(*) count
            FROM practice_submissions ps
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN students s ON s.id=a.student_id
            LEFT JOIN classes c ON c.id=s.class_id
            WHERE s.deleted_at IS NULL AND (c.id IS NULL OR c.deleted_at IS NULL)
            GROUP BY ps.status ORDER BY ps.status`);
          const correctionCandidates = all(`SELECT s.id student_id,s.name student_name,
              a.id assignment_id,a.practice_date,a.status assignment_status,
              ps.id submission_id,ps.status,ps.current_round,ps.needs_correction,
              ps.submitted_at,ps.reviewed_at,ps.completed_at,
              p.teacher_id plan_teacher_id,COALESCE(s.teacher_id,c.teacher_id) effective_teacher_id,
              u.nickname effective_teacher_name,
              (SELECT COUNT(*) FROM practice_attachments pa WHERE pa.submission_id=ps.id) total_attachments,
              (SELECT COUNT(*) FROM practice_attachments pa WHERE pa.submission_id=ps.id AND pa.round_no<ps.current_round) older_attachments,
              (SELECT COUNT(*) FROM practice_attachments pa WHERE pa.submission_id=ps.id AND pa.round_no=ps.current_round) current_attachments,
              (SELECT COUNT(*) FROM practice_attachments pa WHERE pa.submission_id=ps.id AND pa.round_no>ps.current_round) future_attachments,
              (SELECT COUNT(*) FROM practice_attachments pa WHERE pa.submission_id=ps.id
                AND datetime(pa.created_at)>datetime(ps.reviewed_at)) post_review_attachments,
              (SELECT COUNT(*) FROM practice_attachments pa WHERE pa.submission_id=ps.id
                AND pa.round_no=ps.current_round AND datetime(pa.created_at)>datetime(ps.reviewed_at)) post_review_current_attachments,
              (SELECT MAX(pa.round_no) FROM practice_attachments pa WHERE pa.submission_id=ps.id) max_attachment_round,
              (SELECT MAX(pa.created_at) FROM practice_attachments pa WHERE pa.submission_id=ps.id) last_attachment_at,
              (SELECT COUNT(*) FROM practice_submission_rounds r WHERE r.submission_id=ps.id) round_rows,
              (SELECT status FROM practice_submission_rounds r WHERE r.submission_id=ps.id AND r.round_no=ps.current_round LIMIT 1) current_round_status,
              (SELECT COUNT(*) FROM practice_submission_rounds r WHERE r.submission_id=ps.id AND r.round_no>ps.current_round) future_round_rows,
              (SELECT MAX(r.round_no) FROM practice_submission_rounds r WHERE r.submission_id=ps.id) max_round_row,
              (SELECT COUNT(*) FROM practice_review_rounds rr WHERE rr.submission_id=ps.id AND rr.round_no=ps.current_round) current_review_rows
            FROM practice_submissions ps
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN practice_plans p ON p.id=a.plan_id
            JOIN students s ON s.id=a.student_id
            LEFT JOIN classes c ON c.id=s.class_id
            LEFT JOIN users u ON u.id=COALESCE(s.teacher_id,c.teacher_id)
            WHERE ps.status='correction_required' AND s.deleted_at IS NULL
              AND (c.id IS NULL OR c.deleted_at IS NULL)
            ORDER BY a.practice_date,ps.id`);
          const submittedQueue = all(`SELECT s.id student_id,s.name student_name,
              a.id assignment_id,a.practice_date,ps.id submission_id,ps.current_round,
              ps.submitted_at,p.teacher_id plan_teacher_id,
              COALESCE(s.teacher_id,c.teacher_id) effective_teacher_id,u.nickname effective_teacher_name,
              (SELECT COUNT(*) FROM practice_attachments pa WHERE pa.submission_id=ps.id AND pa.round_no=ps.current_round) current_attachments,
              (SELECT status FROM practice_submission_rounds r WHERE r.submission_id=ps.id AND r.round_no=ps.current_round LIMIT 1) current_round_status
            FROM practice_submissions ps
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN practice_plans p ON p.id=a.plan_id
            JOIN students s ON s.id=a.student_id
            LEFT JOIN classes c ON c.id=s.class_id
            LEFT JOIN users u ON u.id=COALESCE(s.teacher_id,c.teacher_id)
            WHERE ps.status='submitted' AND s.deleted_at IS NULL
              AND (c.id IS NULL OR c.deleted_at IS NULL)
            ORDER BY ps.submitted_at,ps.id`);
          const inconsistent = all(`SELECT s.id student_id,s.name student_name,a.id assignment_id,
              ps.id submission_id,ps.status,ps.current_round,ps.needs_correction,
              COALESCE(s.teacher_id,c.teacher_id) effective_teacher_id,
              (SELECT status FROM practice_submission_rounds r WHERE r.submission_id=ps.id AND r.round_no=ps.current_round LIMIT 1) current_round_status,
              (SELECT MAX(pa.round_no) FROM practice_attachments pa WHERE pa.submission_id=ps.id) max_attachment_round,
              (SELECT MAX(r.round_no) FROM practice_submission_rounds r WHERE r.submission_id=ps.id) max_round_row
            FROM practice_submissions ps
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN students s ON s.id=a.student_id
            LEFT JOIN classes c ON c.id=s.class_id
            WHERE s.deleted_at IS NULL AND (c.id IS NULL OR c.deleted_at IS NULL)
              AND ((ps.status='correction_required' AND ps.needs_correction<>1)
                OR (ps.status='submitted' AND ps.needs_correction<>0)
                OR (ps.status IN ('submitted','reviewed','correction_required') AND NOT EXISTS (
                  SELECT 1 FROM practice_submission_rounds r
                  WHERE r.submission_id=ps.id AND r.round_no=ps.current_round))
                OR EXISTS (SELECT 1 FROM practice_submission_rounds r
                  WHERE r.submission_id=ps.id AND r.round_no>ps.current_round+1)
                OR EXISTS (SELECT 1 FROM practice_attachments pa
                  WHERE pa.submission_id=ps.id AND pa.round_no>ps.current_round+1))
            ORDER BY ps.id`);
          const unroutable = all(`SELECT s.id student_id,s.name student_name,a.id assignment_id,
              ps.id submission_id,ps.status,p.teacher_id plan_teacher_id,
              s.teacher_id student_teacher_id,c.teacher_id class_teacher_id,
              s.deleted_at,c.deleted_at class_deleted_at
            FROM practice_submissions ps
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN practice_plans p ON p.id=a.plan_id
            JOIN students s ON s.id=a.student_id LEFT JOIN classes c ON c.id=s.class_id
            WHERE ps.status='submitted' AND (COALESCE(s.teacher_id,c.teacher_id) IS NULL
              OR s.deleted_at IS NOT NULL OR (c.id IS NOT NULL AND c.deleted_at IS NOT NULL))
            ORDER BY ps.id`);
          const attachmentAfterReview = all(`SELECT s.id student_id,s.name student_name,
              a.id assignment_id,a.practice_date,ps.id submission_id,ps.status,ps.current_round,
              ps.reviewed_at,pa.round_no attachment_round,COUNT(*) attachment_count,
              MIN(pa.created_at) first_attachment_at,MAX(pa.created_at) last_attachment_at
            FROM practice_submissions ps
            JOIN practice_assignments a ON a.id=ps.assignment_id
            JOIN students s ON s.id=a.student_id LEFT JOIN classes c ON c.id=s.class_id
            JOIN practice_attachments pa ON pa.submission_id=ps.id
              AND ps.reviewed_at IS NOT NULL AND datetime(pa.created_at)>datetime(ps.reviewed_at)
            WHERE s.deleted_at IS NULL AND (c.id IS NULL OR c.deleted_at IS NULL)
            GROUP BY s.id,s.name,a.id,a.practice_date,ps.id,ps.status,ps.current_round,ps.reviewed_at,pa.round_no
            ORDER BY pa.created_at,ps.id`);
          const integrity = db.exec('PRAGMA integrity_check')[0]?.values?.flat().map(String) || [];
          console.log('PANPAN_ALL_PRACTICE_RECEIPTS=' + JSON.stringify({
            statusSummary, correctionCandidates, submittedQueue, inconsistent, unroutable,
            attachmentAfterReview, integrity,
          }));
          NODE
          REMOTE
